services:
  - type: web
    name: my-new-project
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The anon/publishable key is safe to be public (Supabase's client-side
      # design; real data protection is the RLS policies in
      # supabase/schema.sql), so it's committed here rather than set via the
      # dashboard. Without these the app still works fully in guest
      # (localStorage-only) mode. See supabase/README.md for setup steps.
      - key: VITE_SUPABASE_URL
        value: https://noljjbecuhnwocrihyhz.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_VLPdMuDoFbMGFArN99MerA_6FjKf0H8
